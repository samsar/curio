openapi: 3.1.0
info:
  title: Curio Daemon API
  version: 0.1.0
  description: |
    HTTP+JSON API exposed by `curio-daemon` on `127.0.0.1:8765` (the port is
    configurable; the host must be loopback). Consumed by `curio` CLI,
    `curio-mcp` sidecar, and any future client.

    Conventions:
      - All IDs are UUIDs.
      - All timestamps are RFC 3339 UTC.
      - Errors follow RFC 7807 (`application/problem+json`). Every response
        carries an `X-Request-Id` header, and every problem the same value as
        `request_id`, which is also on the daemon's log lines for the
        request; `instance` is the request path.
      - Unset optional fields are omitted; the API never sends `null`.
      - Responses may gain fields and enum values within /v1: clients ignore
        what they don't know. Requests are strict: an unknown field is a 400
        that names it and, since it usually means a newer client talking to
        an older daemon, says to restart the daemon.
      - The bookmark, document and job lists return `{ items, next_cursor }`,
        next_cursor present exactly when another page follows. Pages are
        keyset-based: they never overlap, inserts don't shift them, and a row
        updated mid-walk moves ahead of the cursor. Cursors are opaque; one a
        daemon upgrade invalidated is a 400, and the walk starts again.
      - Long-running operations are asynchronous and answer 202 with a
        `job_id`, or with `jobs_enqueued` for the bulk refetch-all and
        reindex-all, which have no parent job. Poll `GET /v1/jobs/{id}`.

    Access policy: there is no authentication and no token. The daemon binds
    loopback only and trusts every local process (and OS user) that can reach
    it. It refuses requests a web browser could make on a page's behalf; these
    checks run before routing and apply to every path:
      - `Host` must be `localhost:P` (any case) or an address equal to
        127.0.0.1, ::1 or the bound address, on `P`, the daemon's port.
        Otherwise 403: this is what stops DNS rebinding.
      - A request carrying `Origin` gets 403 unless the Origin is exactly
        `http://127.0.0.1:P`, `http://localhost:P` or `http://[::1]:P`,
        `Origin: null` included. No CORS headers are ever sent.
      - A request with a body must send `Content-Type: application/json`
        (415 otherwise) holding exactly one JSON value. Bodies are capped at
        1 MiB, or 32 MiB for `POST /v1/bookmarks/import` (413 otherwise).
        Body-less POSTs need no Content-Type.
    Hosted-mode authentication is deferred.

servers:
  - url: http://127.0.0.1:8765
    description: Local daemon

tags:
  - name: bookmarks
    description: Bookmark reference records (the v1 reference table)
  - name: documents
    description: Extracted content
  - name: search
    description: Hybrid BM25 + vector retrieval
  - name: insight
    description: Inferred topic clusters ("interests")
  - name: jobs
    description: Async work queue
  - name: system
    description: Health, stats, configuration

paths:

  # ---------- system ----------

  /v1/healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Daemon is up and the dependencies it has checked are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/stats:
    get:
      tags: [system]
      operationId: getStats
      summary: Corpus and queue summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }

  # ---------- bookmarks ----------

  /v1/bookmarks:
    get:
      tags: [bookmarks]
      operationId: listBookmarks
      summary: List bookmarks with filters
      parameters:
        - { in: query, name: source,      schema: { type: string, enum: [chrome, safari, firefox, html, manual] } }
        - { in: query, name: state,       schema: { type: string, enum: [pending, fetched, failed, dead] } }
        - { in: query, name: folder,      schema: { type: string }, description: "Exact folder_path prefix match" }
        - { in: query, name: tag,         schema: { type: string }, description: "Returns bookmarks whose tags array contains this value" }
        - { in: query, name: has_document,schema: { type: boolean }, description: "True = filter to fetched bookmarks only" }
        - { in: query, name: limit,       schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: cursor,      schema: { type: string }, description: "Opaque pagination cursor from a previous response" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkList" }
        "400": { $ref: "#/components/responses/BadRequest" }

    post:
      tags: [bookmarks]
      operationId: createBookmark
      summary: Manually add a single bookmark; fetch is enqueued
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: |
                    Absolute http(s) URL with a host. It is normalized
                    (lowercased host, default port and fragment dropped,
                    tracking parameters removed, remaining query parameters
                    sorted) and the normalized form is both the dedup key and
                    the URL that gets fetched.
                title:       { type: string }
                folder_path: { type: string }
                tags:        { type: array, items: { type: string } }
      responses:
        "201":
          description: Bookmark created; fetch job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkCreated" }
        "400":
          description: url is missing, malformed, not http(s), or has no host
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A bookmark for this normalized URL already exists for this tenant+source
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/bookmarks/import:
    post:
      tags: [bookmarks]
      operationId: importBookmarks
      summary: Bulk import from a browser bookmark file
      description: |
        Async. Parses the file, inserts/dedups bookmarks, enqueues fetch jobs
        for any new URLs. Returns a job ID for the import itself.

        This is the **bulk path** for ingestion. A single Chrome/Safari/Firefox
        export with tens of thousands of bookmarks goes through one request.
        Clients never iterate `POST /v1/bookmarks` for bulk loads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:    { type: string, enum: [chrome, safari, firefox] }
                file_path: { type: string, description: "Absolute path to the bookmark file on the host running the daemon" }
                content:   { type: string, description: "Inline file content (base64). Mutually exclusive with file_path." }
      responses:
        "202":
          description: Import job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }

  /v1/bookmarks/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [bookmarks]
      operationId: getBookmark
      summary: Get a single bookmark by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [bookmarks]
      operationId: deleteBookmark
      summary: Delete a bookmark
      description: |
        Removes the bookmark reference. If no other references point at the
        underlying document, the document and its content files are also
        removed (cascade is handled by the daemon, not the DB).
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/bookmarks/{id}/refetch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [bookmarks]
      operationId: refetchBookmark
      summary: Force re-fetch and re-index of this bookmark's document
      responses:
        "202":
          description: Refetch job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- documents ----------

  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents with filters
      parameters:
        - { in: query, name: content_type, schema: { type: string, enum: [article, repo, video, pdf, thread, unknown] } }
        - { in: query, name: state,        schema: { type: string, enum: [pending, fetched, failed, dead] } }
        - { in: query, name: host,         schema: { type: string }, description: "Filter by URL host (e.g. github.com)" }
        - { in: query, name: limit,        schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: cursor,       schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/documents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get document metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/documents/{id}/content:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Get extracted markdown content for a document
      responses:
        "200":
          description: OK
          content:
            text/markdown:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/documents/{id}/refetch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: force, required: false, schema: { type: string, enum: ["1", "true"] },
          description: Refetch even if the document is dead (a confirmed dead link). }
    post:
      tags: [documents]
      operationId: refetchDocument
      summary: Reset the document to pending and enqueue a fresh fetch job
      description: >
        The state reset and the new job commit together: on failure the
        document keeps its state and no job exists. The current extraction is
        kept until the new fetch replaces it.
      responses:
        "202":
          description: Fetch job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The document is dead and force was not given
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/documents/refetch-all:
    parameters:
      - { in: query, name: state, required: false, schema: { type: string, enum: [pending, fetched, failed, dead] },
          description: "Only refetch documents in this state. Default: pending, fetched and failed; dead documents only when asked for." }
    post:
      tags: [documents]
      operationId: refetchAllDocuments
      summary: Reset matching documents to pending and enqueue a fetch job for each
      description: >
        All-or-nothing: every matching document is reset and gets a fetch job
        in one transaction, or nothing changes. Returns the number of jobs
        enqueued rather than a job_id: there is no parent job to poll; watch
        /v1/jobs or /v1/stats instead.
      responses:
        "202":
          description: Fetch jobs enqueued
          content:
            application/json:
              schema:
                type: object
                required: [jobs_enqueued]
                properties:
                  jobs_enqueued: { type: integer }
        "400":
          description: Unknown state
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/documents/{id}/related:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: k, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 },
          description: Max related documents to return. }
    get:
      tags: [documents]
      operationId: findRelatedDocuments
      summary: Find documents related to this one by embedding similarity
      description: >
        Ranks other documents by vector similarity to this document's stored
        chunk embeddings (mean-pooled; no query text involved). The source
        document is excluded. Returns an empty items list when the document
        has no indexed chunks yet (pending/failed/dead). Scores are raw
        vector similarities (1/(1+L2 distance), 0..1) and are NOT comparable
        with /v1/search's RRF-fused scores.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [doc_id, items]
                properties:
                  doc_id: { type: string, format: uuid }
                  took_ms: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/documents/{id}/references:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [documents]
      operationId: getDocumentReferences
      summary: List every reference (bookmark, history entry, ...) that points at this document
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarks:
                    type: array
                    items: { $ref: "#/components/schemas/Bookmark" }
                  # Future reference kinds appear here as additional fields:
                  # history_entries: [...], highlights: [...], etc.

  # ---------- search ----------

  /v1/search:
    post:
      tags: [search]
      operationId: search
      summary: Hybrid BM25 + vector search
      description: >
        Runs BM25 and vector retrieval concurrently and fuses them with RRF.
        If the embedding model is unavailable (Ollama down, or slower than
        search.embed_timeout_seconds), the keyword results are still returned
        with degraded=true and a warning explaining why; a keyword-index
        failure is a 500. Unknown request fields are rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: Missing query, k outside 1..100, or an unknown field
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------- insight ----------

  /v1/interests:
    get:
      tags: [insight]
      operationId: listInterests
      summary: List inferred interests (labeled topic clusters)
      description: >
        Returns the interests from the latest completed clustering run, largest
        first, with run metadata. An interest is a labeled cluster. Returns an
        empty list when clustering has not run yet.
      parameters:
        - { in: query, name: limit,   schema: { type: integer, default: 50, maximum: 500 }, description: Max interests to return }
        - { in: query, name: members, schema: { type: integer, default: 5, maximum: 100 }, description: Member documents to include per interest }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestList" }

  /v1/interests/rebuild:
    post:
      tags: [insight]
      operationId: rebuildInterests
      summary: Recompute interests from the current corpus (async)
      description: Enqueues a clustering job. Poll the returned job id via /v1/jobs/{id}.
      responses:
        "202":
          description: Clustering job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: Insight layer is disabled (config insight.enabled = false)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/interests/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: members, schema: { type: integer, default: 100, maximum: 1000 }, description: Member documents to include }
    get:
      tags: [insight]
      operationId: getInterest
      summary: Get one interest with its member documents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- jobs ----------

  /v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List background jobs
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, running, done, failed] } }
        - { in: query, name: kind,   schema: { type: string, enum: [fetch, index, import, cluster, summarize] } }
        - { in: query, name: limit,  schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/jobs/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get a single job
      description: >
        The job as the list shows it, with its document's URL, title and
        markdown path. Poll it with the job_id a refetch, reindex or
        interests rebuild returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/jobs/{id}/retry:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [jobs]
      operationId: retryJob
      summary: Re-enqueue a failed job
      responses:
        "202":
          description: Job re-enqueued (status returns to `pending`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Job is not in a re-runnable state (already running or done)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:

  responses:
    BadRequest:
      description: >
        A filter parameter outside its enum, or a cursor this daemon didn't
        issue. Sizing
        parameters (limit, members, k, window) are never refused: a value
        outside their range means their default.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:

    # ---------- shared ----------

    Problem:
      description: RFC 7807 problem details
      type: object
      properties:
        type:       { type: string, format: uri, default: about:blank }
        title:      { type: string }
        status:     { type: integer }
        detail:     { type: string }
        instance:   { type: string, description: "The request path" }
        request_id: { type: string, description: "The response's X-Request-Id; quote it against the daemon log" }
      required: [title, status]

    JobRef:
      type: object
      properties:
        job_id: { type: string, format: uuid }
      required: [job_id]

    Cursor:
      type: object
      properties:
        next_cursor: { type: string, description: "Present exactly when another page follows; pass it as ?cursor" }

    # ---------- system ----------

    Health:
      type: object
      properties:
        status:           { type: string, enum: [ok, degraded] }
        pid:              { type: integer, description: "Process ID of the daemon that answered" }
        home:             { type: string, description: "Absolute $CURIO_HOME the answering daemon serves" }
        version:          { type: string }
        schema_version:   { type: integer }
        embedding_model:  { type: string }
        embedding_dim:    { type: integer }
        ollama_reachable: { type: boolean }

    Stats:
      type: object
      properties:
        bookmarks_total:    { type: integer }
        documents_total:    { type: integer }
        documents_by_state:
          type: object
          additionalProperties: { type: integer }
        documents_by_content_type:
          type: object
          additionalProperties: { type: integer }
        jobs_pending:       { type: integer }
        jobs_running:       { type: integer }
        jobs_failed:        { type: integer }
        last_index_at:      { type: string, format: date-time, nullable: true }

    # ---------- bookmarks ----------

    Bookmark:
      type: object
      properties:
        id:            { type: string, format: uuid }
        url:           { type: string, format: uri }
        title:         { type: string, nullable: true }
        saved_at:      { type: string, format: date-time }
        source:        { type: string, enum: [chrome, safari, firefox, manual] }
        folder_path:   { type: string, nullable: true }
        tags:          { type: array, items: { type: string } }
        document_id:   { type: string, format: uuid, nullable: true }
        document_state: { type: string, enum: [pending, fetched, failed, dead], description: "Derived from documents.state for convenience" }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
      required: [id, url, saved_at, source]

    BookmarkList:
      allOf:
        - $ref: "#/components/schemas/Cursor"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Bookmark" }

    BookmarkCreated:
      type: object
      properties:
        bookmark: { $ref: "#/components/schemas/Bookmark" }
        job_id:   { type: string, format: uuid, description: "ID of the enqueued fetch job" }

    # ---------- documents ----------

    Document:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        url:                   { type: string, format: uri }
        url_canonical:         { type: string, format: uri, nullable: true }
        content_type:          { type: string, enum: [article, repo, video, pdf, thread, unknown] }
        title:                 { type: string, nullable: true }
        author:                { type: string, nullable: true }
        published_at:          { type: string, format: date-time, nullable: true }
        language:              { type: string, nullable: true }
        word_count:            { type: integer, nullable: true }
        state:                 { type: string, enum: [pending, fetched, failed, dead] }
        current_extraction:    { $ref: "#/components/schemas/Extraction", nullable: true }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }
      required: [id, url, content_type, state]

    Extraction:
      type: object
      properties:
        id:              { type: string, format: uuid }
        fetched_at:      { type: string, format: date-time }
        fetcher:         { type: string }
        status:          { type: string, enum: [ok, partial, paywalled, error] }
        markdown_path:   { type: string, description: "Absolute on-disk path to the extracted markdown" }
        error_message:   { type: string, nullable: true }
        extraction_meta: { type: object, additionalProperties: true }

    DocumentList:
      allOf:
        - $ref: "#/components/schemas/Cursor"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Document" }

    # ---------- search ----------

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Natural-language or keyword query
        k:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Max documents to return after RRF fusion + collapse, 1 to 100.
            Omitted (or 0) uses the server's search.default_k (10 unless
            configured).
        filters:
          type: object
          description: >
            Every dimension given is applied. Folder and tag filters,
            per-request RRF weights, collapse strategy and saved-date filters
            are not implemented; the server config sets the weights and
            collapse strategy, and sending any of them is a 400.
          properties:
            content_type: { type: array, items: { type: string, enum: [article, repo, video, pdf, thread, unknown] } }
            host:         { type: array, items: { type: string } }
            source:       { type: array, items: { type: string, enum: [chrome, safari, firefox, html, manual] } }

    SearchHit:
      type: object
      properties:
        document: { $ref: "#/components/schemas/Document" }
        score:    { type: number, description: "Fused RRF score (higher = better)" }
        matches:
          type: array
          description: Top matching chunks for this document, in score order
          items:
            type: object
            properties:
              chunk_id:    { type: string, format: uuid }
              ord:         { type: integer }
              text:        { type: string, description: "Chunk text, possibly with highlight markers" }
              bm25_score:  { type: number, nullable: true }
              vector_score: { type: number, nullable: true }

    SearchResponse:
      type: object
      properties:
        query:       { type: string }
        took_ms:     { type: integer, description: "Time the search engine took, in milliseconds" }
        bm25_hits:   { type: integer, description: "How many chunks BM25 returned before fusion" }
        vector_hits: { type: integer, description: "How many chunks the vector index returned before fusion (0 when degraded)" }
        degraded:
          type: boolean
          description: >
            Present and true when semantic search was unavailable and items
            are keyword-only (BM25) results.
        warnings:
          type: array
          items: { type: string }
          description: Why the results are degraded; present only when there is something to report.
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    # ---------- insight ----------

    InterestMember:
      type: object
      properties:
        doc_id:        { type: string, format: uuid }
        title:         { type: string }
        url:           { type: string }
        markdown_path: { type: string, description: "Absolute on-disk path to the member's extracted markdown" }
        similarity:    { type: number, description: "Cosine similarity to the cluster centroid (0..1)" }
      required: [doc_id, url, similarity]

    Interest:
      type: object
      description: A labeled topic cluster.
      properties:
        id:       { type: string, format: uuid }
        label:    { type: string, description: "Topic name; omitted when unlabeled" }
        summary:  { type: string }
        size:     { type: integer, description: "Number of member documents" }
        cohesion: { type: number, description: "Mean member cosine to the cluster centroid (0..1)" }
        members:
          type: array
          items: { $ref: "#/components/schemas/InterestMember" }
      required: [id, size, cohesion]

    InterestList:
      type: object
      description: >
        Not cursor-paginated — interests are a small bounded snapshot returned
        with the metadata of the run that produced them.
      properties:
        run_id:        { type: string, format: uuid }
        computed_at:   { type: string, format: date-time, nullable: true }
        algo:          { type: string, description: "Clusterer name, e.g. knn-graph" }
        num_documents: { type: integer, description: "Documents considered in the run" }
        num_clusters:  { type: integer }
        num_noise:     { type: integer, description: "Documents left unclustered" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Interest" }
      required: [num_documents, num_clusters, num_noise, items]

    # ---------- jobs ----------

    Job:
      type: object
      properties:
        id:         { type: string, format: uuid }
        kind:       { type: string, enum: [fetch, index, import, cluster, summarize] }
        status:     { type: string, enum: [pending, running, done, failed] }
        attempts:   { type: integer }
        payload:    { type: object, additionalProperties: true }
        last_error: { type: string, nullable: true }
        run_after:  { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, kind, status]

    JobList:
      allOf:
        - $ref: "#/components/schemas/Cursor"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Job" }
