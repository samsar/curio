openapi: 3.1.0
info:
  title: Curio Daemon API
  version: 0.1.0
  description: |
    HTTP+JSON API exposed by `curio-daemon` on `127.0.0.1:8765` (the port is
    configurable; the host must be loopback). Consumed by the `curio` CLI,
    the `curio-mcp` sidecar, and any future client.

    This file is the contract. Tests in `internal/api` check it against the
    router (every route is documented, every documented operation is
    routed) and against live responses (every operation's real answers
    validate against their schemas, with undeclared fields treated as
    errors). The clients in `internal/client` are written by hand; code
    generation is deferred.

    Conventions:
      - IDs are UUIDs. Timestamps are RFC 3339, UTC.
      - Unset optional fields are omitted; the API never sends `null`.
      - Errors follow RFC 7807 (`application/problem+json`). Every response
        carries an `X-Request-Id` header, and every problem repeats it as
        `request_id`, which is also on the daemon's log lines for the
        request; `instance` is the request path. A 404 names what is
        missing. A 500's detail is the raw error text.
      - Responses are read tolerantly: they may gain fields and enum values
        within /v1, and clients ignore what they don't know. Requests are
        strict: an unknown field is a 400 that names it and, since it
        usually means a newer client talking to an older daemon, says to
        restart the daemon. Clients send only the optional fields they set.
      - List filters outside their enum are a 400. Sizing parameters
        (`limit`, `children`, `members`, `k`, `window`) are never refused:
        a value outside their range, or not a number, means their default.
      - The bookmark, document and job lists return `{ items, next_cursor }`,
        `next_cursor` present exactly when another page follows. Documents
        and jobs come most recently updated first; bookmarks newest first
        by when curio added them, or with `order=saved` by when the browser
        saved them. Pages are keyset-based: they never overlap, inserts
        don't shift them, and a row updated mid-walk moves ahead of the
        cursor. Cursors are opaque and page only the list and order that
        issued them; any other, or one a daemon upgrade invalidated, is a
        400, and the walk starts again.
      - Work that runs in the background answers 202: with a `job_id` to
        poll at `GET /v1/jobs/{id}` (refetch, reindex, interests rebuild,
        which answers the rebuild already queued when there is one),
        or with `jobs_enqueued` for the bulk refetch-all and reindex-all,
        which have no parent job. Imports are synchronous per request; the
        fetches they enqueue are not.
      - `PUT /v1/queue` is a partial update: it changes only the fields the
        body gives, and answers with the whole queue.
      - Startup: the daemon answers from the moment it binds its port, but
        until it is ready (while it migrates its database, say) every
        request gets 503 with a `Retry-After` header and a problem of type
        `urn:curio:problem:daemon-starting`. On `/v1/healthz` that problem
        also names the daemon (`pid`, `home`, `version`) and says how far
        along it is (`phase`, `migrations`). Nothing a starting daemon
        refused has run, so any request can be sent again once it is ready.

    Access policy: there is no authentication and no token. The daemon binds
    loopback only and trusts every local process (and OS user) that can reach
    it. It refuses requests a web browser could make on a page's behalf; these
    checks run before routing and apply to every path:
      - `Host` must be `localhost:P` (any case) or an address equal to
        127.0.0.1, ::1 or the bound address, on `P`, the daemon's port.
        Otherwise 403: this is what stops DNS rebinding.
      - A request carrying `Origin` gets 403 unless the Origin is exactly
        `http://127.0.0.1:P`, `http://localhost:P` or `http://[::1]:P`,
        `Origin: null` included. No CORS headers are ever sent.
      - A change (any method but GET, HEAD and OPTIONS) carrying
        `Sec-Fetch-Site`, which browsers send, gets 403 unless it carries it
        once, as `same-origin`: a browser's changes come from the daemon's
        own pages. Clients that aren't browsers send no such header.
      - A request with a body must send `Content-Type: application/json`
        (415 otherwise) holding exactly one JSON value. Bodies are capped at
        1 MiB, or 32 MiB for `POST /v1/bookmarks/import` (413 otherwise).
        Body-less POSTs need no Content-Type.
    Hosted-mode authentication is deferred.

    Outside this contract, `/` and `/ui/` serve the dashboard's HTML pages
    (docs/ui.md), unless config.yaml's `daemon.ui` is false. They answer
    under the same access policy, GET only, each with a strict
    Content-Security-Policy, and refuse another site's subresource
    requests (`Sec-Fetch-Site` cross-site or same-site without a
    top-level navigation). Their changes, when they make any, go through
    this API as JSON.

servers:
  - url: http://127.0.0.1:8765
    description: Local daemon

tags:
  - name: bookmarks
    description: Bookmark reference records (the v1 reference table)
  - name: documents
    description: Extracted content
  - name: search
    description: Hybrid BM25 + vector retrieval
  - name: insight
    description: Interests, and the areas holding them, that rebuilds find across the library
  - name: jobs
    description: Background work queue
  - name: system
    description: Health, stats and metrics

paths:

  # ---------- system ----------

  /v1/healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Readiness probe, and which daemon answered
      description: >
        200 once the daemon serves the full API, 503 while it is still
        starting; both name the daemon that answered (pid, home). A ready
        daemon answers within about half a second whatever state Ollama is
        in: an unreachable or slow Ollama is reported in ollama_reachable
        and ollama_detail, not as an error, the services fetches depend
        on (the Jina Reader fallback) in upstreams, and a change in the
        build that makes the embeddings, once a re-embedded sample of the
        library shows it changed the vectors or can't be checked, in
        embedding_drift. A starting one answers at once.
      responses:
        "200":
          description: The daemon is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: >
            The daemon is starting and serves nothing else yet. Ask again
            after Retry-After seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Starting" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/stats:
    get:
      tags: [system]
      operationId: getStats
      summary: Corpus and queue counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Per-kind job durations and failures
      description: >
        Derived from the jobs table on demand. Counts and durations cover
        jobs that finished within the window, and durations successful jobs
        only; running and oldest_running_seconds describe right now,
        whatever the window.
      parameters:
        - in: query
          name: window
          description: Seconds to look back. Out of range or malformed means the default.
          schema: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------- bookmarks ----------

  /v1/bookmarks:
    get:
      tags: [bookmarks]
      operationId: listBookmarks
      summary: List bookmarks, newest added or newest saved first
      description: >
        Bookmarks newest first by when curio added them, or with
        `order=saved` by when the browser saved them; a page saved in two
        browsers is two bookmarks. Every filter given must match: source,
        folder and host on the bookmark, state, content type and cause on
        its document, which a bookmark linked to no document never matches.
        Each filter is checked on the bookmarks the list walks in its
        order, so one that matches few bookmarks reads more of the list to
        fill a page.
      parameters:
        - in: query
          name: order
          description: >
            `created` (the default) lists bookmarks newest first by when
            curio added them (`created_at`), which follows imports: an
            import's bookmarks come together. `saved` lists them newest
            first by when the browser saved them (`saved_at`). Safari keeps
            no save dates, so its bookmarks carry the time curio imported
            them. A cursor pages only the order that issued it.
          schema: { type: string, enum: [created, saved], default: created }
        - in: query
          name: source
          schema: { $ref: "#/components/schemas/Source" }
        - in: query
          name: folder
          description: >
            The folder and every folder under it, matched on path segments
            and case-sensitively; a trailing "/" is ignored and "/" alone is
            no filter.
          schema: { type: string }
        - in: query
          name: host
          description: >
            Bookmarks whose http or https URL has exactly this host, matched
            case-insensitively, every character literal (no wildcards, no
            subdomains), as the document list's host filter matches it.
          schema: { type: string }
        - in: query
          name: state
          description: Bookmarks whose document is in this state.
          schema: { $ref: "#/components/schemas/DocState" }
        - in: query
          name: content_type
          description: Bookmarks whose document has this content type.
          schema: { $ref: "#/components/schemas/ContentType" }
        - in: query
          name: cause
          description: Bookmarks whose document failed for this cause (dead ones for dead_link).
          schema: { $ref: "#/components/schemas/FailureCause" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of bookmarks, each with what the list shows of its document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        default: { $ref: "#/components/responses/Problem" }

    post:
      tags: [bookmarks]
      operationId: createBookmark
      summary: Add one bookmark; a URL new to the corpus gets a fetch job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookmarkRequest" }
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkCreated" }
        "400":
          description: url is missing, malformed, not http(s), or has no host; or the body is malformed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A manual bookmark for this normalized URL already exists
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/bookmarks/import:
    post:
      tags: [bookmarks]
      operationId: importBookmarks
      summary: Import a batch of parsed bookmarks
      description: |
        Synchronous: the bookmarks are saved and counted before the
        response, one transaction each, and a fetch job is enqueued for
        every URL new to the corpus; the fetches run in the background. The
        client parses the browser's bookmark file and sends the result, in
        batches (the CLI sends 500 at a time). A bookmark that already
        exists for this source is skipped; one curio can't fetch is
        filtered and counted under its reason.

        With dry_run, nothing is written: the response is the one this
        body would get against the library as it is now, with dry_run
        true and new_urls, the URLs the import would fetch (so
        jobs_enqueued counts the fetches it would enqueue). `curio up`
        counts a source's new bookmarks this way, sending its distinct
        URLs alone, up to 10,000 a request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: What the batch did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: Unknown source, an empty batch, or a malformed body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          description: The body is over 32 MiB
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/bookmarks/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [bookmarks]
      operationId: getBookmark
      summary: Get one bookmark
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [bookmarks]
      operationId: deleteBookmark
      summary: Delete a bookmark
      description: Removes the bookmark only; its document stays in the corpus.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------- documents ----------

  /v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents, most recently updated first
      description: >
        Every filter given must match. The cause filter reads only the
        documents that failed for its cause. Each other filter is checked on
        the documents the list walks in its order, so one that matches few
        documents reads more of the list to fill a page.
      parameters:
        - in: query
          name: state
          schema: { $ref: "#/components/schemas/DocState" }
        - in: query
          name: content_type
          schema: { $ref: "#/components/schemas/ContentType" }
        - in: query
          name: host
          description: >
            Documents whose http or https URL has exactly this host, matched
            case-insensitively, every character literal (no wildcards, no
            subdomains), as the search host filter matches it.
          schema: { type: string }
        - in: query
          name: folder
          description: >
            Documents with a bookmark in this folder or any folder under it,
            matched as the bookmark list's folder filter: on path segments
            and case-sensitively; a trailing "/" is ignored and "/" alone is
            no filter.
          schema: { type: string }
        - in: query
          name: cause
          description: Documents that failed for this cause (dead ones for dead_link).
          schema: { $ref: "#/components/schemas/FailureCause" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of documents, each with its last error and markdown path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/lookup:
    get:
      tags: [documents]
      operationId: lookupDocument
      summary: Find the document for a URL
      description: |
        The URL is normalized the way ingest stores it (lowercased host,
        default port, fragment and tracking parameters dropped), so a URL
        as typed or pasted finds its document. Answers as
        GET /v1/documents/{id} does.
      parameters:
        - in: query
          name: url
          required: true
          schema: { type: string }
          description: The page's URL, as bookmarked or pasted.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get document metadata and its current extraction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/{id}/content:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Get the extracted markdown
      responses:
        "200":
          description: OK
          content:
            text/markdown:
              schema: { type: string }
        "404":
          description: >
            No such document, or it has no content yet (never fetched, or
            its markdown was deleted from disk).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/{id}/related:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - in: query
        name: k
        description: Max related documents. Out of range or malformed means the default.
        schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    get:
      tags: [documents]
      operationId: findRelatedDocuments
      summary: Find documents related to this one by embedding similarity
      description: >
        Ranks other documents by vector similarity to this document's stored
        chunk embeddings (mean-pooled; no query text involved, so Ollama is
        not needed). The source document is excluded, and so are failed and
        dead documents, whose chunks come from an earlier fetch. Returns an
        empty items list when the document has no indexed chunks yet. Scores
        are raw vector similarities (1/(1+L2 distance), 0..1) and are NOT
        comparable with /v1/search's RRF-fused scores.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/{id}/refetch:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - in: query
        name: force
        description: 1 or true (any case) refetches a dead document too.
        schema: { type: string }
    post:
      tags: [documents]
      operationId: refetchDocument
      summary: Reset the document to pending and enqueue a fresh fetch job
      description: >
        The state reset and the new job commit together: on failure the
        document keeps its state and no job exists. The current extraction is
        kept until the new fetch replaces it.
      responses:
        "202":
          description: Fetch job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The document is dead (a confirmed dead link) and force was not given
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/refetch-all:
    parameters:
      - in: query
        name: state
        description: "Only refetch documents in this state. Default: pending, fetched and failed; dead documents only when asked for."
        schema: { $ref: "#/components/schemas/DocState" }
      - in: query
        name: cause
        description: >
          Only refetch documents that failed for this cause, among the
          state's or the default's. dead_link needs state=dead: dead links'
          documents are dead, which the default leaves out.
        schema: { $ref: "#/components/schemas/FailureCause" }
    post:
      tags: [documents]
      operationId: refetchAllDocuments
      summary: Reset matching documents to pending and enqueue a fetch job for each
      description: >
        All-or-nothing: every matching document is reset, its failure cause
        cleared, and gets a fetch job in one transaction, or nothing
        changes. There is no parent job to poll; watch GET /v1/jobs or
        GET /v1/stats instead.
      responses:
        "202":
          description: Fetch jobs enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobsEnqueued" }
        "400":
          description: A state or cause outside its enum, or cause=dead_link without state=dead
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/{id}/reindex:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [documents]
      operationId: reindexDocument
      summary: Enqueue an index job over the document's current extraction
      description: >
        Re-chunks and re-embeds the markdown already on disk; nothing is
        refetched and the document's state is left alone.
      responses:
        "202":
          description: Index job enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The document has no extraction to reindex; refetch it first
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/documents/reindex-all:
    parameters:
      - in: query
        name: state
        description: "Reindex the documents in this state that have content. Default: fetched."
        schema: { $ref: "#/components/schemas/DocState" }
    post:
      tags: [documents]
      operationId: reindexAllDocuments
      summary: Enqueue an index job for every document in a state that has content
      description: >
        Index jobs change no document state, so a partial run strands
        nothing; a failure stops the run and the 500 says how many jobs were
        enqueued before it. There is no parent job to poll. With
        state=fetched, the default, the fetched documents are every
        searchable one, so once all their jobs are enqueued the embedding
        drift baseline is reset: the recorded model digest and Ollama
        version are cleared, and the daemon's next check records the build
        serving now, which clears embedding_drift on healthz. A failed
        reset is a 500 whose detail says all the jobs were enqueued. Before
        it enqueues them, a state=fetched run with documents owes the
        interests a fresh rebuild (fresh_owed reindex on the interests'
        state), which the daemon queues once the re-embedding has drained:
        until then interests keep their last grouping and new documents
        aren't placed. Other states leave the baseline and the interests
        alone.
      responses:
        "202":
          description: Index jobs enqueued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobsEnqueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/failures:
    get:
      tags: [documents]
      operationId: listFailures
      summary: Count the failed and dead documents by cause, with the hosts most of each are on
      description: >
        Causes with no documents are left out; the others come the most
        documents first, then by cause. Each names at most 5 hosts, the most
        documents first, then by host. A host is as the documents list's
        host filter matches it (lowercased, with its port, www. kept), so
        GET /v1/documents?cause=C&host=H lists exactly the documents the
        pair counts. A document whose URL has no host counts toward its
        cause alone.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailureSummary" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------- search ----------

  /v1/search:
    post:
      tags: [search]
      operationId: search
      summary: Hybrid BM25 + vector search
      description: >
        Runs BM25 and vector retrieval concurrently and fuses them with RRF.
        Every request ranks the same pool, the best 100 documents at most,
        whatever k and offset it sends, and returns its window of that
        ranking, [offset, offset+k): pages of one query tile one ranking,
        and a request without an offset gets its first k. total counts the
        ranking, and capped says more matched than it holds.
        Failed and dead documents are not searched: they may keep the chunks
        of an earlier fetch, which no longer describe what the URL serves. A
        pending document (a refetch in flight) is. If the embedding model is
        unavailable (Ollama down, or slower than search.embed_timeout_seconds),
        the keyword results are still returned with degraded=true and a
        warning explaining why; a keyword-index failure is a 500.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: >
            Missing query, k outside 0..100, an offset below 0 or with
            offset + k over 100 (k as omitted means the default), a
            content_type or source outside its set, an unknown field, or a
            malformed body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------- insight ----------

  /v1/interests:
    get:
      tags: [insight]
      operationId: listInterests
      summary: List the latest rebuild's areas and interests
      description: >
        Returns a page of the latest rebuild's top-level groups, largest
        first (by size, then cohesion, then id): its areas, each with its
        largest interests, or, in a library of one level (shape flat), its
        interests. With level=interest it lists every interest, each with
        its area. The response carries what the run found and where the
        next rebuild stands (next). Before the first rebuild is done the
        list is empty, without the run fields, and next says why.
      parameters:
        - in: query
          name: limit
          description: Max groups. Out of range or malformed means the default.
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          description: >
            How many groups to skip, in the list's order. An offset at or
            past the end answers an empty page of the run, not an error.
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: children
          description: Interests listed of each area; 0 for none. Out of range or malformed means the default.
          schema: { type: integer, minimum: 0, maximum: 100, default: 5 }
        - in: query
          name: members
          description: Member documents listed of each interest; 0 for none. Out of range or malformed means the default.
          schema: { type: integer, minimum: 0, maximum: 100, default: 3 }
        - in: query
          name: level
          description: interest lists every interest, largest first, each with its area; absent lists the top-level groups.
          schema: { type: string, enum: [interest] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestList" }
        "400":
          description: An offset that isn't a whole number of 0 or more, or a level other than interest
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/interests/unsorted:
    get:
      tags: [insight]
      operationId: listUnsorted
      summary: List the documents in no interest, nearest first
      description: >
        Returns a page of the latest rebuild's unsorted documents: those no
        interest holds and none is close to. They come most similar to
        their nearest interest first, then by document id, each naming
        that interest. Also lists the documents placed in Unsorted since
        the rebuild, newest first.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - in: query
          name: offset
          description: >
            How many documents to skip, in the list's order. An offset at
            or past the end answers an empty page, not an error.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnsortedPage" }
        "400":
          description: An offset that isn't a whole number of 0 or more
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/interests/changes:
    get:
      tags: [insight]
      operationId: interestChanges
      summary: What the latest rebuild changed
      description: >
        The latest rebuild's events, without the identities it kept where
        they were: the areas and interests it split, merged, moved,
        dissolved and created, ordered by event (split, merged, moved,
        dissolved, new), then level (areas first), then label and id.
        Empty before the first rebuild is done.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterestChanges" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/interests/rebuild:
    post:
      tags: [insight]
      operationId: rebuildInterests
      summary: Rebuild the interests now
      description: >
        Queues a rebuild of the interests and answers its job id, or, when
        one is queued already, that one's: one rebuild waits at most. A
        running rebuild doesn't count, so a request during one queues the
        next. The daemon rebuilds on its own as the library changes; a
        request skips what it waits for (enough changes, a quiet library,
        an embedding drift's hold, a failed rebuild's backoff), but not the
        queue's gate. Poll the job at /v1/jobs/{id}.
      parameters:
        - in: query
          name: fresh
          description: >
            1 or true (any case) makes the rebuild fresh, grouping the
            library from scratch rather than from the current grouping;
            names that survive still carry over. It is owed until a fresh
            rebuild that read the library after the request commits, so it
            holds when a pending rebuild is answered.
          schema: { type: string }
      responses:
        "202":
          description: A rebuild is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "409":
          description: Insight layer is disabled (config insight.enabled = false)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/interests/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - in: query
        name: members
        description: >
          For an interest, its member documents to include, then its loose
          fits (default 100, max 1000); for an area, each of its
          interests' members (default 3, max 100). 0 for none. Out of
          range or malformed means the default.
        schema: { type: integer, minimum: 0, maximum: 1000 }
      - in: query
        name: offset
        description: >
          For an interest, how many of its members, then loose fits, to
          skip, most similar first (then by document id). An offset at or
          past the end answers the interest without members, not an
          error. An area ignores it.
        schema: { type: integer, minimum: 0, default: 0 }
    get:
      tags: [insight]
      operationId: getInterest
      summary: Get one area, with its interests, or one interest, with a page of its documents
      description: >
        IDs last across rebuilds while the documents they name do. One a
        rebuild retired answers 410 with the identities that took its
        documents.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interest" }
        "400":
          description: An offset that isn't a whole number of 0 or more
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: A rebuild retired it; the problem says when, and what took its documents
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RetiredInterest" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------- jobs ----------

  /v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List background jobs, most recently updated first
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/JobStatus" }
        - in: query
          name: kind
          schema: { $ref: "#/components/schemas/JobKind" }
        - in: query
          name: document_id
          description: >
            Only the jobs that work on this document. An ID no job works on,
            a document's that doesn't exist included, lists none.
          schema: { type: string }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: One page of jobs, each with its document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [jobs]
      operationId: deleteJobs
      summary: Delete finished jobs, by status or by age
      description: >
        Exactly one of status and older_than. Only finished (done or failed)
        jobs are ever deleted: a pending or running job is live work. There
        is no way to delete every job. Deleting jobs changes no document
        state.
      parameters:
        - in: query
          name: status
          description: Delete every job in this finished status.
          schema: { type: string, enum: [done, failed] }
        - in: query
          name: older_than
          description: Delete finished jobs last updated longer ago than this Go duration, or Nd for days (30d, 24h, 2h30m).
          schema: { type: string }
      responses:
        "200":
          description: Jobs deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteJobsResult" }
        "400":
          description: Neither or both of status and older_than, a status that isn't finished, or a malformed duration
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get a single job
      description: >
        The job as the list shows it, with its document's URL, title and
        markdown path. Poll it with the job_id a refetch, reindex or
        interests rebuild returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/queue:
    get:
      tags: [jobs]
      operationId: getQueue
      summary: Whether the workers may start jobs, and each pool's limit and load
      description: >
        The queue gate's settings (pause, throttle, schedule), whether the
        queue is open now, and for each worker pool how many of its jobs
        may run at once and how many are running and pending; and the
        keep-awake setting, whether the Mac is held awake, and its power
        source. The queue is daemon-wide: the counts cover every tenant's
        jobs, as the workers claim them. Reading it runs nothing: the power
        source is the one last read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [jobs]
      operationId: updateQueue
      summary: Pause or resume the queue, throttle it, schedule it, or keep the Mac awake for it
      description: >
        Applies only the fields given, and answers with the queue as GET
        does. A change takes effect at the workers' next claim and never
        interrupts a running job: pausing lets the jobs in hand finish.
        The settings are stored, so they survive a daemon restart. Pause
        and schedule must both allow a claim: resuming outside the schedule
        leaves the queue closed until the window opens, and schedule off
        opens it now. keep_awake takes effect at once and never gates a
        claim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueUpdate" }
      responses:
        "200":
          description: The queue after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "400":
          description: >
            No field given, a throttle other than normal or gentle, a
            schedule that isn't HH:MM-HH:MM with different ends or off, a
            value of the wrong type (keep_awake is a boolean), or a
            malformed body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

components:

  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      description: Rows per page. Out of range or malformed means the default.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Cursor:
      in: query
      name: cursor
      description: >
        The next_cursor of the previous page. A cursor pages only the list,
        and the order, that issued it; any other is a 400.
      schema: { type: string }

  responses:
    Problem:
      description: >
        An error. Besides the statuses an operation lists: 403 for a request
        a browser could have made (see the access policy), 405 for a method
        the path doesn't take (with an Allow header), 413 for an oversized
        body, 415 for a body that isn't application/json, 500 for a failure
        in the daemon, logged under the request_id, and 503 with a
        Retry-After header while the daemon is starting (type
        urn:curio:problem:daemon-starting; see the Startup convention).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: >
        A filter or order parameter outside its enum, or a cursor this
        daemon didn't issue for this list and order.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource; the detail names it.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:

    # ---------- shared ----------

    Problem:
      description: RFC 7807 problem details
      type: object
      properties:
        type:       { type: string, format: uri, default: about:blank }
        title:      { type: string }
        status:     { type: integer }
        detail:     { type: string }
        instance:   { type: string, description: "The request path" }
        request_id: { type: string, description: "The response's X-Request-Id; quote it against the daemon log" }
      required: [title, status]

    JobRef:
      type: object
      properties:
        job_id: { type: string, format: uuid, description: "Poll it at GET /v1/jobs/{id}" }
      required: [job_id]

    JobsEnqueued:
      type: object
      properties:
        jobs_enqueued: { type: integer }
      required: [jobs_enqueued]

    DocState:
      type: string
      enum: [pending, fetched, failed, dead]

    FailureCause:
      type: string
      description: >
        Why a failed or dead document failed: dead_link (the content is
        gone; a dead document's cause, and only its), anti_bot (the site
        blocked the request), login_wall (a login page, or too little text
        to be the article), jina_refused (the Jina Reader fallback refused
        the target, a publisher's opt-out or a deterministic 4xx, normally
        after the site served a page curio can't use), tls (the certificate
        failed verification), unreachable (the host doesn't resolve or
        refuses connections), timeout, network (any other transport
        failure), rate_limited (the site, GitHub, YouTube or Jina Reader
        asked curio to slow down: a 429, or Jina Reader's block of the
        site's keyless reads), http_error (any other status), unsupported
        (a URL or content curio can't read), too_large (over the body cap),
        index (fetched, then indexing gave up), other.
      enum: [dead_link, anti_bot, login_wall, jina_refused, tls, unreachable, timeout, network, rate_limited,
        http_error, unsupported, too_large, index, other]

    ContentType:
      type: string
      enum: [article, repo, video, pdf, thread, unknown]

    JobStatus:
      type: string
      enum: [pending, running, done, failed]

    JobKind:
      type: string
      enum: [fetch, index, import, cluster, summarize]

    Source:
      type: string
      enum: [chrome, safari, firefox, html, manual]

    # ---------- system ----------

    Health:
      type: object
      properties:
        status:           { type: string, enum: [ok] }
        pid:              { type: integer, description: "Process ID of the daemon that answered" }
        home:             { type: string, description: "Absolute $CURIO_HOME the answering daemon serves" }
        version:          { type: string }
        schema_version:   { type: integer }
        embedding_model:  { type: string, description: "The model that made this home's vectors, as its marker records" }
        embedding_dim:    { type: integer, description: "This home's vector width, fixed when it was created" }
        embedding_drift:  { $ref: "#/components/schemas/EmbeddingDrift" }
        generation_model: { type: string, description: "The generation.model the daemon started with (config.yaml's, or the default); it takes a restart to change" }
        ollama_reachable: { type: boolean }
        ollama_detail:    { type: string, description: "Why Ollama isn't usable; present only when it isn't" }
        upstreams:
          type: array
          description: >
            The services fetches depend on: today the Jina Reader fallback,
            named jina. Empty when the daemon tracks none. A failing one
            doesn't make the daemon unhealthy: status stays ok.
          items: { $ref: "#/components/schemas/UpstreamHealth" }
        youtube_fetcher:
          type: string
          description: >
            The yt-dlp the daemon found when it started, which YouTube
            videos go to for their transcripts; absent when they go to the
            default fetcher. It takes a restart to see a yt-dlp installed
            since.
        github_token:
          type: boolean
          description: >
            Whether the GitHub fetcher sends a token (fetcher.github.token,
            or CURIO_GITHUB_TOKEN in the daemon's environment). Without one
            GitHub allows 60 API requests an hour; with any token, even one
            with no scopes, 5,000.
        interests: { $ref: "#/components/schemas/InterestsState" }
      required: [status, pid, home, version, schema_version, embedding_model, embedding_dim, generation_model, ollama_reachable, upstreams, github_token, interests]

    EmbeddingDrift:
      description: >
        Present only while the build that makes this home's embeddings
        differs from the one recorded when the library was indexed (the
        embedding model's manifest digest, what `ollama list` shows, or the
        Ollama version) and a sample of the library re-embedded by the build
        serving now doesn't match the stored vectors, or can't be checked.
        Either part can change the vectors the model returns, so new query
        vectors stop matching the stored ones; many changes don't, and a
        sample that matches makes the new build the recorded one without a
        report. The daemon checks once a minute and verifies each change
        once; this is its last check, not a call made for the request. It
        never reindexes by itself, and status stays ok.
      type: object
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/DriftChange" }
        verification: { $ref: "#/components/schemas/DriftVerification" }
        fix:
          type: string
          description: "What re-embeds the library and resets the baseline: curio reindex --all"
        checked_at: { type: string, format: date-time, description: "When the daemon last checked" }
      required: [changes, verification, fix, checked_at]

    DriftVerification:
      description: >
        What the drift was reported on. Verified: the daemon re-embedded
        one chunk from each of up to 64 fetched documents (16 by their
        longest chunk, 48 at random) through the indexer's own requests,
        and some came back further than cosine 0.9999 from their stored
        vectors, or of another length. Not verified: the build serving now
        couldn't embed the sample at all (a reply of another width, an input
        too long, a request Ollama refuses), which isn't retried; or three
        attempts in a row failed, which the daemon keeps retrying.
      type: object
      properties:
        verified: { type: boolean, description: "Whether a re-embedded sample showed the change" }
        sampled:  { type: integer, minimum: 0, description: "Chunks re-embedded; 0 when not verified" }
        changed:  { type: integer, minimum: 0, description: "Chunks whose vector didn't match its stored one; 0 when not verified" }
        min_cosine:
          type: number
          minimum: -1
          maximum: 1
          description: "The worst chunk's cosine with its stored vector; present only when verified"
        detail:
          type: string
          description: >
            The daemon's wording of the evidence, which clients print as it
            is: "64 of 64 sampled chunks changed (worst cosine 0.9713)", or
            "not verified: " and why.
        sampled_at: { type: string, format: date-time, description: "When the sample was compared, or given up on" }
      required: [verified, sampled, changed, detail, sampled_at]

    DriftChange:
      type: object
      properties:
        what:     { type: string, enum: [model_digest, ollama_version] }
        recorded: { type: string, description: "The value when the library was indexed" }
        current:  { type: string, description: "The value serving now" }
      required: [what, recorded, current]

    UpstreamHealth:
      description: >
        How an upstream's recent requests went. The daemon keeps it in
        memory from its start, one outcome per request: a healthy answer
        (ok, judged, refused) or a service-level failure (every other
        class).
      type: object
      properties:
        name:    { type: string, description: "The upstream: jina, the Jina Reader fallback" }
        enabled: { type: boolean, description: "Whether it is configured on (fetcher.native.jina_fallback for jina)" }
        state:
          type: string
          enum: [disabled, idle, ok, degraded, paused, failing]
          description: |
            The first of these that holds:
              - disabled: configured off.
              - failing: nothing but failures since its last healthy answer, on two or more target hosts, and either 5 of them or over 30 minutes; it lasts until the next healthy answer, however long that takes.
              - paused: calls are held back until cooldown_until, after a rate limit or a challenge.
              - idle: no calls in the window.
              - degraded: at least a quarter of the calls in the window failed.
              - ok: calls in the window, less than a quarter of them failures.
        last_success_at:
          type: string
          format: date-time
          description: The last healthy answer; absent when there has been none since the daemon started.
        last_failure_at:
          type: string
          format: date-time
          description: The last service-level failure; absent when there has been none.
        last_failure_class:
          type: string
          enum: [challenged, forbidden, rate_limited, auth, server_error, network]
          description: |
            The last failure's class, present with last_failure_at:
              - challenged: the upstream's CDN took curio for a bot.
              - forbidden: a 403 that names no target.
              - rate_limited: a 429, or Jina Reader's block of a site's keyless reads (see site_pauses).
              - auth: a 401 or 402, about curio's key or account.
              - server_error: a 5xx, 408, 421 or 425, or an answer that is none (1xx, 3xx).
              - network: no whole answer: a transport error, a timeout, a TLS failure, a body cut short.
        window_seconds: { type: integer, description: "How far back recent looks, to the minute" }
        recent:
          type: object
          description: |
            Calls in the window per class; classes without calls are absent. The keys are the failure classes of last_failure_class and the healthy ones:
              - ok: the upstream served the page.
              - judged: it answered, and the answer is not the page (a challenge or login page, the target's error status, a body over the size cap).
              - refused: it declined the target on purpose (a domain it excludes, a 4xx about the request).
          additionalProperties: { type: integer }
        cooldown_until:
          type: string
          format: date-time
          description: When the pause in effect ends; present only while one is.
        site_pauses:
          type: array
          description: >
            The sites the upstream blocks for now, by site, each until a UTC
            time; absent when there are none. For jina, Jina Reader's blocks
            of a site's keyless reads (an AbuseAlleviationError): curio holds
            the site's pages until the block ends. A block of one site leaves
            state alone.
          items:
            type: object
            properties:
              site:  { type: string, description: "The site: a registrable domain, such as twitter.com, or a host that has none" }
              until: { type: string, format: date-time, description: "When the block ends" }
            required: [site, until]
      required: [name, enabled, state, window_seconds, recent]

    Starting:
      description: >
        A starting daemon's healthz answer: an RFC 7807 problem of type
        urn:curio:problem:daemon-starting, plus which daemon answered and
        how far along it is.
      type: object
      properties:
        type:       { type: string, format: uri, enum: ["urn:curio:problem:daemon-starting"] }
        title:      { type: string }
        status:     { type: integer, enum: [503] }
        detail:     { type: string, description: "What the daemon is doing, in a sentence" }
        instance:   { type: string, description: "The request path" }
        request_id: { type: string, description: "The response's X-Request-Id; quote it against the daemon log" }
        pid:        { type: integer, description: "Process ID of the daemon that answered" }
        home:       { type: string, description: "Absolute $CURIO_HOME the answering daemon serves" }
        version:    { type: string }
        phase:
          type: string
          enum: [initializing, migrating]
          description: >
            migrating while it applies schema migrations to an existing
            database, which can take minutes on a large library;
            initializing for everything else, usually milliseconds
        migrations:
          type: object
          description: Present exactly while phase is migrating
          properties:
            applied: { type: integer }
            total:   { type: integer }
          required: [applied, total]
      required: [type, title, status, pid, home, version, phase]

    Stats:
      type: object
      properties:
        version:         { type: string, description: "The daemon's version" }
        bookmarks_total: { type: integer }
        documents_total: { type: integer }
        documents_by_state:
          type: object
          description: Documents per state; states with none are absent.
          additionalProperties: { type: integer }
        jobs_by_status:
          type: object
          description: Jobs per status; statuses with none are absent.
          additionalProperties: { type: integer }
      required: [version, bookmarks_total, documents_total]

    Metrics:
      type: object
      properties:
        window_seconds: { type: integer }
        by_kind:
          type: array
          description: One row per job kind that finished in the window or is running, sorted by kind.
          items: { $ref: "#/components/schemas/KindMetrics" }
      required: [window_seconds, by_kind]

    KindMetrics:
      type: object
      properties:
        kind:                   { $ref: "#/components/schemas/JobKind" }
        count:                  { type: integer, description: "Jobs that finished (done or failed) in the window" }
        failed:                 { type: integer }
        mean_ms:                { type: number, description: "Durations are of successful jobs only" }
        p50_ms:                 { type: number }
        p95_ms:                 { type: number }
        p99_ms:                 { type: number }
        running:                { type: integer, description: "Running now, whatever the window" }
        oldest_running_seconds: { type: integer }
      required: [kind, count, failed, mean_ms, p50_ms, p95_ms, p99_ms, running, oldest_running_seconds]

    # ---------- bookmarks ----------

    Bookmark:
      type: object
      properties:
        id:             { type: string, format: uuid }
        url:            { type: string, format: uri }
        title:          { type: string }
        saved_at:       { type: string, format: date-time }
        source:         { $ref: "#/components/schemas/Source" }
        folder_path:    { type: string }
        tags:           { type: array, items: { type: string } }
        document_id:    { type: string, format: uuid, description: "Absent once the document is deleted" }
        document_state: { $ref: "#/components/schemas/DocState" }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
      required: [id, url, saved_at, source, created_at, updated_at]

    BookmarkListItem:
      type: object
      description: >
        A bookmark as the list shows it: the Bookmark, and what the list
        shows of its document. The document fields are absent when empty,
        and all of them when the bookmark links to no document.
      properties:
        id:                     { type: string, format: uuid }
        url:                    { type: string, format: uri }
        title:                  { type: string }
        saved_at:               { type: string, format: date-time }
        source:                 { $ref: "#/components/schemas/Source" }
        folder_path:            { type: string }
        tags:                   { type: array, items: { type: string } }
        document_id:            { type: string, format: uuid, description: "Absent once the document is deleted" }
        document_state:         { $ref: "#/components/schemas/DocState" }
        document_title:         { type: string, description: "The document's own title, from its fetch" }
        document_content_type:  { $ref: "#/components/schemas/ContentType" }
        document_failure_cause: { $ref: "#/components/schemas/FailureCause" }
        document_last_error:    { type: string, description: "Of the most recent failed job for the document" }
        created_at:             { type: string, format: date-time }
        updated_at:             { type: string, format: date-time }
      required: [id, url, saved_at, source, created_at, updated_at]

    BookmarkList:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/BookmarkListItem" } }
        next_cursor: { type: string, description: "Present exactly when another page follows; pass it as ?cursor" }
      required: [items]

    CreateBookmarkRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: |
            Absolute http(s) URL with a host. It is normalized (lowercased
            host, default port and fragment dropped, tracking parameters
            removed, remaining query parameters sorted) and the normalized
            form is both the dedup key and the URL that gets fetched.
        title:       { type: string }
        folder_path: { type: string }
        tags:        { type: array, items: { type: string } }
      required: [url]

    BookmarkCreated:
      type: object
      properties:
        bookmark: { $ref: "#/components/schemas/Bookmark" }
        job_id:
          type: string
          description: >
            The fetch job enqueued for a URL new to the corpus, or empty when
            the corpus already had the document (its state is in
            bookmark.document_state).
      required: [bookmark, job_id]

    ImportRequest:
      type: object
      properties:
        source: { $ref: "#/components/schemas/Source" }
        bookmarks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ImportBookmark" }
        dry_run:
          type: boolean
          description: Count what the import would do, and write nothing
      required: [source, bookmarks]

    ImportBookmark:
      type: object
      properties:
        url:         { type: string, description: "As the browser stored it; normalized, or filtered, by the daemon" }
        title:       { type: string }
        folder_path: { type: string }
        tags:        { type: array, items: { type: string } }
        saved_at:    { type: string, format: date-time, description: "Omitted when the source has no date; the daemon uses now" }
      required: [url]

    ImportResult:
      type: object
      properties:
        source:        { $ref: "#/components/schemas/Source" }
        total:         { type: integer, description: "Bookmarks in the batch" }
        created:       { type: integer }
        skipped:       { type: integer, description: "Already saved for this source" }
        filtered:      { type: integer, description: "URLs curio can't fetch" }
        jobs_enqueued: { type: integer, description: "Fetches for URLs new to the corpus" }
        filtered_by:
          type: object
          description: Filtered bookmarks per reason; absent when none were.
          additionalProperties: { type: integer }
        errors:
          type: array
          description: The first few per-bookmark failures; absent when there were none.
          items: { type: string }
        dry_run:
          type: boolean
          description: The counts are what the import would do; nothing was written. Absent otherwise.
        new_urls:
          type: array
          description: >
            For a dry run, the normalized URLs whose documents the import
            would create and fetch, one each, in request order; absent when
            there are none, and for an import.
          items: { type: string }
      required: [source, total, created, skipped, filtered, jobs_enqueued]

    # ---------- documents ----------

    Document:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        url:                { type: string, format: uri }
        url_canonical:      { type: string, format: uri }
        content_type:       { $ref: "#/components/schemas/ContentType" }
        title:              { type: string }
        author:             { type: string }
        published_at:       { type: string, format: date-time }
        language:           { type: string }
        word_count:         { type: integer }
        state:              { $ref: "#/components/schemas/DocState" }
        failure_cause:      { $ref: "#/components/schemas/FailureCause" }
        current_extraction: { $ref: "#/components/schemas/Extraction" }
        created_at:         { type: string, format: date-time }
        updated_at:         { type: string, format: date-time }
      required: [id, url, content_type, state, created_at, updated_at]

    Extraction:
      type: object
      properties:
        id:              { type: string, format: uuid }
        fetched_at:      { type: string, format: date-time }
        fetcher:         { type: string }
        status:          { type: string, enum: [ok, partial, paywalled, error] }
        markdown_path:   { type: string, description: "Absolute on-disk path to the extracted markdown" }
        error_message:   { type: string, description: "Why the extraction isn't ok. For a partial one, why its primary content is missing (a video transcript yt-dlp couldn't download, say)" }
        extraction_meta: { type: object, additionalProperties: true, description: "What the fetcher recorded; its shape varies by fetcher" }
      required: [id, fetched_at, fetcher, status]

    DocumentListItem:
      type: object
      description: A document as the list shows it, for debugging a corpus in one call.
      properties:
        id:            { type: string, format: uuid }
        url:           { type: string, format: uri }
        title:         { type: string }
        content_type:  { $ref: "#/components/schemas/ContentType" }
        state:         { $ref: "#/components/schemas/DocState" }
        failure_cause: { $ref: "#/components/schemas/FailureCause" }
        last_error:    { type: string, description: "Of the most recent failed job for the document" }
        markdown_path: { type: string, description: "Absolute on-disk path to the current extraction's markdown" }
        bookmark_title:
          type: string
          description: >
            Set only when the document has no title of its own: the title
            of its most recently saved bookmark that has one.
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
      required: [id, url, content_type, state, created_at, updated_at]

    DocumentList:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/DocumentListItem" } }
        next_cursor: { type: string, description: "Present exactly when another page follows; pass it as ?cursor" }
      required: [items]

    FailureSummary:
      type: object
      properties:
        total:  { type: integer, description: "Failed and dead documents: the sum of the causes' counts" }
        causes: { type: array, items: { $ref: "#/components/schemas/FailureCauseCount" } }
      required: [total, causes]

    FailureCauseCount:
      type: object
      properties:
        cause: { $ref: "#/components/schemas/FailureCause" }
        count: { type: integer }
        hosts:
          type: array
          description: At most 5, the most documents first, then by host
          items: { $ref: "#/components/schemas/HostCount" }
      required: [cause, count, hosts]

    HostCount:
      type: object
      properties:
        host:  { type: string }
        count: { type: integer }
      required: [host, count]

    RelatedResponse:
      type: object
      properties:
        doc_id:  { type: string, format: uuid }
        took_ms: { type: integer }
        items:   { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
      required: [doc_id, took_ms, items]

    # ---------- search ----------

    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: Natural-language or keyword query
        k:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Max documents to return after RRF fusion + collapse, 1 to 100.
            Omitted (or 0) uses the server's search.default_k (10 unless
            configured).
        offset:
          type: integer
          minimum: 0
          maximum: 99
          description: >
            Where the results start in the query's ranking: the response is
            the window [offset, offset+k) of one ranking of at most 100
            documents, the same ranking for every offset, so the pages of a
            query tile it. offset + k is at most 100, k as the request gets
            it (the default when omitted). Omitted means 0.
        filters:
          type: object
          description: >
            Every dimension given is applied. Folder and tag filters,
            per-request RRF weights, collapse strategy and saved-date filters
            are not implemented; the server config sets the weights and
            collapse strategy, and sending any of them is a 400.
          properties:
            content_type: { type: array, items: { $ref: "#/components/schemas/ContentType" } }
            host:         { type: array, items: { type: string }, description: "URL hosts, matched exactly and case-insensitively" }
            source:       { type: array, items: { $ref: "#/components/schemas/Source" } }
      required: [query]

    SearchHit:
      type: object
      properties:
        document:      { $ref: "#/components/schemas/Document" }
        score:         { type: number, description: "Fused RRF score for search, vector similarity for related (higher = better)" }
        markdown_path: { type: string, description: "Absolute on-disk path to the document's current markdown" }
        bookmark_title:
          type: string
          description: >
            Set only when the document has no title of its own: the title
            of its most recently saved bookmark that has one, as the
            documents list names it.
        matches:
          type: array
          description: Top matching chunks for this document, in score order
          items: { $ref: "#/components/schemas/ChunkMatch" }
      required: [document, score]

    ChunkMatch:
      type: object
      properties:
        chunk_id:     { type: string, format: uuid }
        text:         { type: string, description: "The chunk's text" }
        snippet:      { type: string, description: "The BM25 snippet, with <em> highlight markers; absent for vector-only matches" }
        bm25_score:   { type: number, description: "Absent when BM25 didn't return the chunk" }
        vector_score: { type: number, description: "Absent when vector search didn't return the chunk" }
      required: [chunk_id, text]

    SearchResponse:
      type: object
      properties:
        query:       { type: string }
        took_ms:     { type: integer, description: "Time the search took, in milliseconds" }
        bm25_hits:   { type: integer, description: "How many chunks BM25 returned before fusion" }
        vector_hits: { type: integer, description: "How many chunks the vector index returned before fusion (0 when degraded)" }
        total:
          type: integer
          description: >
            How many documents the query's ranking holds, at most 100:
            every offset below it has results.
        capped:
          type: boolean
          description: >
            Whether the ranked pool held more documents than the ranking
            keeps, so total is 100 and the rest are never returned. The pool
            is each retriever's best 800 chunks: a keyword-only search whose
            words appear in more chunks than that may match more documents
            than it counts. With semantic search on nearly every query is
            capped: the vector index's nearest chunks span far more than 100
            documents.
        degraded:
          type: boolean
          description: >
            Present and true when semantic search was unavailable and items
            are keyword-only (BM25) results.
        warnings:
          type: array
          items: { type: string }
          description: Why the results are degraded; present only when there is something to report.
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
      required: [query, took_ms, bm25_hits, vector_hits, total, capped, items]

    # ---------- insight ----------

    InterestMember:
      type: object
      properties:
        doc_id:         { type: string, format: uuid }
        title:          { type: string, description: "The document's own title; omitted when it has none" }
        bookmark_title: { type: string, description: "For an untitled document, its most recently saved bookmark's title, when that has one" }
        url:            { type: string, format: uri }
        state:          { $ref: "#/components/schemas/DocState" }
        markdown_path:  { type: string, description: "Absolute on-disk path to the member's extracted markdown" }
        similarity:     { type: number, description: "Cosine similarity to the interest's centroid, in the rebuild's centered space (-1..1)" }
        fit:
          type: string
          enum: [member, loose, new]
          description: >
            member: the rebuild grouped it in the interest; loose: in no
            interest, but close to this one; new: placed into it since the
            rebuild
      required: [doc_id, url, state, similarity, fit]

    InterestRef:
      type: object
      properties:
        id:      { type: string, format: uuid }
        label:   { type: string }
        retired: { type: boolean, description: "A rebuild retired it: its id answers 410" }
      required: [id, retired]

    InterestEvent:
      type: object
      description: >
        What a rebuild did to an identity: kept or moved it (moved into
        another area, named by area), split part of it off into another,
        merged part of it into another shared with others, dissolved it, or
        created it (new).
      properties:
        event:  { type: string, enum: [kept, moved, split, merged, dissolved, new] }
        level:  { type: string, enum: [area, interest] }
        from:   { $ref: "#/components/schemas/InterestRef" }
        to:     { $ref: "#/components/schemas/InterestRef" }
        area:   { $ref: "#/components/schemas/InterestRef" }
        shared: { type: integer, description: "How many of from's members to holds" }
      required: [event, level]

    Interest:
      type: object
      description: >
        An area or an interest as the latest rebuild found it. Its id lasts
        across rebuilds. An area carries num_children and some of its
        interests; an interest some of its members, and on its own page its
        loose fits after them, the documents placed into it since the
        rebuild (new_members) and its events in the rebuild.
      properties:
        id:           { type: string, format: uuid }
        run_id:       { type: string, format: uuid, description: "The rebuild the response reads" }
        level:        { type: string, enum: [area, interest] }
        parent_id:    { type: string, format: uuid, description: "An interest's area; absent for an area or in a library of one level" }
        parent_label: { type: string }
        label:        { type: string, description: "Topic name; omitted when unlabeled" }
        summary:      { type: string }
        size:         { type: integer, description: "Member documents, across every page of them; an area's, its interests'" }
        loose:        { type: integer, description: "Loose fits: documents in no interest, close to this one" }
        new:          { type: integer, description: "Documents placed into it since the rebuild" }
        cohesion:     { type: number, description: "Mean member cosine to the members' centroid" }
        num_children: { type: integer, description: "An area's interests, listed or not" }
        children:
          type: array
          items: { $ref: "#/components/schemas/ChildInterest" }
        members:
          type: array
          items: { $ref: "#/components/schemas/InterestMember" }
        new_members:
          type: array
          description: The documents placed into it since the rebuild, newest first, 20 at most
          items: { $ref: "#/components/schemas/InterestMember" }
        events:
          type: array
          items: { $ref: "#/components/schemas/InterestEvent" }
      required: [id, run_id, level, size, loose, new, cohesion]

    ChildInterest:
      type: object
      description: One of an area's interests, as the area lists it.
      properties:
        id:           { type: string, format: uuid }
        run_id:       { type: string, format: uuid }
        level:        { type: string, enum: [interest] }
        parent_id:    { type: string, format: uuid, description: "The area" }
        parent_label: { type: string }
        label:        { type: string, description: "Topic name; omitted when unlabeled" }
        summary:      { type: string }
        size:         { type: integer }
        loose:        { type: integer }
        new:          { type: integer }
        cohesion:     { type: number }
        members:
          type: array
          items: { $ref: "#/components/schemas/InterestMember" }
      required: [id, run_id, level, parent_id, size, loose, new, cohesion]

    InterestRebuild:
      type: object
      description: >
        What the latest rebuild was (what started it, and whether it
        started from the previous grouping and ran the split check) and
        what it did to the interests.
      properties:
        trigger:           { type: string, enum: [first, auto, manual, reindex, params, shape] }
        kind:              { type: string, enum: [fresh, warm] }
        split_check:       { type: boolean }
        changed_documents: { type: integer, description: "Documents added, left, deleted or reindexed since the rebuild before read the library" }
        kept:              { type: integer, description: "Interests whose identity carried over, moved ones included" }
        created:           { type: integer }
        split:             { type: integer }
        merged:            { type: integer }
        moved:             { type: integer }
        dissolved:         { type: integer }
      required: [trigger, kind, split_check, changed_documents, kept, created, split, merged, moved, dissolved]

    InterestsState:
      type: object
      description: >
        Where automatic rebuilds of the interests stand, as the daemon's
        last check found them (it checks every minute and whenever a
        rebuild is asked for, starts or ends): the same on healthz and as
        GET /v1/interests' next. The daemon queues a rebuild once enough of
        the library changed (rebuild_at), or a fresh one is owed, and
        nothing was indexed for a while. The fields that don't apply are
        left out.
      properties:
        state:
          type: string
          description: >
            The first that holds: rebuilding (one runs); queued (one waits,
            perhaps behind the queue's gate); held (the embeddings drifted,
            held_reason says how: nothing is rebuilt or placed on its own
            until `curio reindex --all`); failing (the last rebuild failed,
            last_error says why; the next is tried at retry_at); due (enough
            changed, or a fresh rebuild is owed, and the library hasn't
            settled yet); current (the last rebuild is current); none (no
            rebuild yet, and too few documents for the first). off with the
            insight layer disabled, and unknown only before the daemon's
            first check. Clients read a state they don't know as current.
        last_rebuild_at:   { type: string, format: date-time, description: "When the last rebuild finished" }
        last_kind:         { type: string, enum: [fresh, warm] }
        last_trigger:      { type: string, enum: [first, auto, manual, reindex, params, shape] }
        changed_documents:
          type: integer
          description: >
            Documents added, left (failed, dead or refetching), deleted or
            reindexed since the last rebuild read the library; before the
            first, the fetched documents. Absent when none.
        rebuild_at:
          type: integer
          description: >
            How many changed documents make the next rebuild due: 5% of the
            last rebuild's documents, at least 5; before the first, the 20
            fetched documents it waits for.
        due_since:   { type: string, format: date-time, description: "When the rebuild became due, while it is" }
        fresh_owed:
          type: string
          enum: [reindex, manual, params]
          description: >
            Why the next rebuild will be fresh: the library was re-embedded
            (it waits for the re-embedding to finish), one was asked for, or
            the grouping's parameters changed.
        held_reason: { type: string, description: "How the embeddings drifted, while that holds rebuilds" }
        retry_at:    { type: string, format: date-time, description: "When the next rebuild is tried after the failed ones" }
        last_error:  { type: string, description: "Why the last rebuild failed, while rebuilds are failing" }
      required: [state]

    InterestList:
      type: object
      description: >
        Paged by offset within the run: a run's groups never change, so an
        offset names the same groups on every read of that run. A rebuild
        makes a new run, and a client sees it by comparing run_id across
        pages; total is the run's groups the list counts. The run fields
        are absent before the first rebuild is done.
      properties:
        run_id:        { type: string, format: uuid }
        computed_at:   { type: string, format: date-time }
        algo:          { type: string, description: "Grouper name, e.g. louvain" }
        shape:         { type: string, enum: [flat, areas], description: "areas: interests grouped into areas; flat: one level" }
        num_documents: { type: integer, description: "Documents the run grouped: members, loose fits and unsorted" }
        num_areas:     { type: integer }
        num_interests: { type: integer }
        num_loose:     { type: integer, description: "Documents in no interest, close to one" }
        num_unsorted:  { type: integer, description: "Documents close to no interest" }
        num_new:       { type: integer, description: "Documents placed since the rebuild" }
        total:         { type: integer, description: "The run's groups this list counts: its areas, or its interests in the flat shape or with level=interest" }
        rebuild:       { $ref: "#/components/schemas/InterestRebuild" }
        next:          { $ref: "#/components/schemas/InterestsState" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Interest" }
      required: [num_documents, num_areas, num_interests, num_loose, num_unsorted, num_new, total, next, items]

    UnsortedMember:
      type: object
      properties:
        doc_id:         { type: string, format: uuid }
        title:          { type: string, description: "The document's own title; omitted when it has none" }
        bookmark_title: { type: string, description: "For an untitled document, its most recently saved bookmark's title, when that has one" }
        url:            { type: string, format: uri }
        state:          { $ref: "#/components/schemas/DocState" }
        markdown_path:  { type: string, description: "Absolute on-disk path to its extracted markdown" }
        similarity:     { type: number, description: "Cosine similarity to its nearest interest's centroid" }
        nearest_id:     { type: string, format: uuid, description: "The interest it is nearest; absent when there is none, and for a document placed since" }
        nearest_label:  { type: string }
      required: [doc_id, url, state, similarity]

    UnsortedPage:
      type: object
      properties:
        run_id:  { type: string, format: uuid, description: "Absent before the first rebuild is done" }
        total:   { type: integer, description: "The run's unsorted documents" }
        num_new: { type: integer, description: "Documents placed in Unsorted since the rebuild" }
        items:
          type: array
          items: { $ref: "#/components/schemas/UnsortedMember" }
        new:
          type: array
          description: The documents placed in Unsorted since the rebuild, newest first, 20 at most
          items: { $ref: "#/components/schemas/UnsortedMember" }
      required: [total, num_new, items, new]

    InterestChanges:
      type: object
      properties:
        run_id:      { type: string, format: uuid, description: "Absent before the first rebuild is done" }
        computed_at: { type: string, format: date-time }
        rebuild:     { $ref: "#/components/schemas/InterestRebuild" }
        events:
          type: array
          items: { $ref: "#/components/schemas/InterestEvent" }
      required: [events]

    RetiredInterest:
      description: >
        A retired area or interest: an RFC 7807 problem of type
        urn:curio:problem:interest-retired, plus when it was retired, by
        which rebuild, and the identities that took its documents there.
        None took them when it dissolved.
      type: object
      properties:
        type:       { type: string, format: uri, enum: ["urn:curio:problem:interest-retired"] }
        title:      { type: string }
        status:     { type: integer, enum: [410] }
        detail:     { type: string, description: "What became of it, in a sentence" }
        instance:   { type: string, description: "The request path" }
        request_id: { type: string, description: "The response's X-Request-Id; quote it against the daemon log" }
        id:         { type: string, format: uuid }
        level:      { type: string, enum: [area, interest] }
        label:      { type: string }
        retired_at: { type: string, format: date-time }
        run_id:     { type: string, format: uuid, description: "The rebuild that retired it" }
        successors:
          type: array
          items:
            type: object
            properties:
              id:      { type: string, format: uuid }
              level:   { type: string, enum: [area, interest] }
              label:   { type: string }
              event:   { type: string, enum: [split, merged] }
              shared:  { type: integer, description: "How many of its members the successor took" }
              retired: { type: boolean }
            required: [id, level, event, shared, retired]
      required: [type, title, status, id, level, retired_at, run_id, successors]

    # ---------- jobs ----------

    Job:
      type: object
      properties:
        id:            { type: string, format: uuid }
        kind:          { $ref: "#/components/schemas/JobKind" }
        status:        { $ref: "#/components/schemas/JobStatus" }
        attempts:      { type: integer }
        payload:       { description: "The job's input, as stored: any JSON value" }
        last_error:
          type: string
          description: >
            A failed job's error. A pending or running job's is the error of
            the attempt it retries after, or, for a job deferred while an
            upstream's rate limit held curio back, what it waits for
            ("waiting for GitHub's API rate limit to reset"). Cleared when
            the job is done.
        run_after:
          type: string
          format: date-time
          description: >
            When a pending job may next run: after a retry's backoff, or when
            the hold a deferred job waits for ends. Stale once the job is
            done or failed.
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }
        doc_url:       { type: string, format: uri, description: "Of the document the job works on; absent for jobs without one" }
        doc_title:     { type: string }
        markdown_path: { type: string, description: "Absolute on-disk path to the document's current markdown" }
      required: [id, kind, status, attempts, run_after, created_at, updated_at]

    JobList:
      type: object
      properties:
        items:       { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: string, description: "Present exactly when another page follows; pass it as ?cursor" }
      required: [items]

    DeleteJobsResult:
      type: object
      properties:
        deleted: { type: integer }
        mode:    { type: string, description: "The mode as given: status=<status> or older_than=<duration>" }
      required: [deleted, mode]

    Throttle:
      type: string
      enum: [normal, gentle]
      description: |
        How hard the workers run:
          - normal: every worker the daemon has (daemon.fetch_workers and daemon.index_workers).
          - gentle: at most 4 fetches and 1 index job at once, to spare the machine; clustering is unchanged.

    Queue:
      type: object
      description: The queue gate and the load behind it.
      properties:
        paused:
          type: boolean
          description: Whether the queue is paused. It stays paused, across restarts, until resumed.
        throttle: { $ref: "#/components/schemas/Throttle" }
        schedule:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: >
            The daily window jobs may start in, on the daemon's local clock:
            from the first time up to the second, wrapping midnight when the
            second is earlier (22:00-07:00 runs overnight). Absent when there
            is no schedule.
        keep_awake:
          type: boolean
          description: >
            Whether the daemon keeps the Mac from idle sleep while its
            workers have queued work, the queue isn't paused, and the Mac
            runs on AC power. Stored, off until turned on.
        keep_awake_active:
          type: boolean
          description: Whether the daemon holds the Mac awake now (caffeinate runs).
        power_source:
          type: string
          enum: [ac, battery, unknown]
          description: >
            Where the Mac draws its power from, as the daemon last read it
            (pmset, at most once a minute while there is work); unknown
            until it has, or when it can't tell. Present exactly while
            keep_awake is on.
        state:
          type: string
          enum: [open, closed]
          description: Whether the workers may start jobs now. A throttle never closes the queue.
        reason:
          type: string
          enum: [paused, outside_schedule]
          description: Why the queue is closed, paused first when both hold; present exactly when state is closed.
        opens_at:
          type: string
          format: date-time
          description: When the schedule next opens the queue; present exactly when reason is outside_schedule.
        kinds:
          type: array
          description: The worker pools' kinds, in the order fetch, index, cluster.
          items: { $ref: "#/components/schemas/QueueKind" }
      required: [paused, throttle, keep_awake, keep_awake_active, state, kinds]

    QueueKind:
      type: object
      properties:
        kind:    { $ref: "#/components/schemas/JobKind" }
        limit:   { type: integer, description: "How many jobs of the kind may run at once while the queue is open" }
        running: { type: integer, description: "Running now, daemon-wide" }
        pending: { type: integer, description: "Waiting to run, daemon-wide, the ones due later included" }
        due_later:
          type: integer
          description: >
            How many of the pending jobs can't run yet, because their
            run_after is still ahead: a retry backing off after a failed
            attempt, or a job deferred while an upstream's rate limit holds
            curio back.
        next_due:
          type: string
          format: date-time
          description: When the first of the jobs due later can run; present exactly when due_later is above 0.
      required: [kind, limit, running, pending, due_later]

    QueueUpdate:
      type: object
      description: The settings to change; at least one.
      minProperties: 1
      properties:
        paused:   { type: boolean, description: "true pauses the queue, false resumes it" }
        throttle: { $ref: "#/components/schemas/Throttle" }
        schedule:
          type: string
          pattern: "^(([01]?[0-9]|2[0-3]):[0-5][0-9]-([01]?[0-9]|2[0-3]):[0-5][0-9]|off)$"
          description: >
            HH:MM-HH:MM on the daemon's local clock, the two times different,
            to let jobs start only in that daily window; off to drop the
            schedule. The hour may have one digit.
        keep_awake:
          type: boolean
          description: true keeps the Mac awake while there is work and it runs on AC power; false stops that
