# golangci-lint v2 config — see https://golangci-lint.run/usage/configuration/
#
# Policy: every enabled linter finds real defects or outdated idioms in this
# tree, and the tree stays at zero issues. A hit is fixed, or silenced at the
# line with a //nolint that names one linter and says why (nolintlint
# enforces both). The only config-level exclusions are the ones below, each
# with its reason.
#
# What each linter is for:
#   errcheck, errchkjson, errorlint, nilerr, nilnil  errors: unchecked,
#       unchecked JSON, wrapped without %w, returned as nil, nil-and-nil
#   bodyclose, rowserrcheck, sqlclosecheck, noctx  resources and contexts:
#       HTTP bodies and SQL rows closed, requests and dials that carry ctx
#   gosec          subprocesses, file modes and other security footguns
#   exhaustive     switches over enums name every member
#   govet, staticcheck, unused, ineffassign, unconvert, copyloopvar
#                  the standard correctness and dead-code set
#   gocritic, revive  readability and suspicious constructs (revive's rules
#       are listed explicitly below)
#   modernize, intrange, usestdlibvars, perfsprint  current idioms: min/max,
#       slices/maps, range-over-int, net/http constants, errors.New for
#       constant messages
#   prealloc, misspell  small wins
#   depguard       the store boundary and test-only dependencies
#   nolintlint     keeps suppressions specific and explained

version: "2"

run:
  timeout: 5m
  tests: true
  # Tag-gated files are linted too: the sqlite tags every build needs, the
  # live-site integration test and the end-to-end test.
  build-tags: [sqlite_fts5, sqlite_json, integration, e2e]

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars

  settings:
    depguard:
      rules:
        # Consumers depend on the internal/store interfaces. Only the daemon's
        # main wires the SQLite implementation (plus tests and the
        # test-support packages that build real stores).
        store-boundary:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/curio-daemon/**"
            - "!**/internal/store/sqlite/**"
            - "!**/internal/api/apitest/**"
          deny:
            - pkg: github.com/samsar/curio/internal/store/sqlite
              desc: depend on the internal/store interfaces; only cmd/curio-daemon wires the SQLite implementation
        # Test-support packages import testing by design, so they are the
        # only non-test files allowed to. Deny matches by import-path
        # prefix, which also covers testing/fstest and friends.
        no-test-deps-in-prod:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/store/sqlite/sqlitetest/**"
            - "!**/internal/api/apitest/**"
          deny:
            - pkg: testing
              desc: production code must not link the testing package
            - pkg: github.com/stretchr/testify
              desc: testify is for _test.go files only
            - pkg: github.com/samsar/curio/internal/store/sqlite/sqlitetest
              desc: sqlitetest is test support; production code opens databases through internal/store/sqlite
            - pkg: github.com/samsar/curio/internal/api/apitest
              desc: apitest is test support; production code serves the API through internal/api
            - pkg: github.com/getkin/kin-openapi
              desc: kin-openapi checks the API against its spec in tests; it must never link into a binary
    errcheck:
      # Errors that carry nothing to act on: a deferred Close on something
      # only read, and a Rollback, which is a no-op after Commit and whose
      # failure otherwise loses to the error that caused it.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (*database/sql.Tx).Rollback
    exhaustive:
      # A default does not make a switch exhaustive: new enum members must be
      # handled on purpose.
      default-signifies-exhaustive: false
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck owns them, with its exclusions
        - G304 # file inclusion via variable: paths come from the operator's own arguments, config and $CURIO_HOME
        - G703 # path traversal taint: same operator-supplied paths as G304
    misspell:
      ignore-rules:
        - strat   # intentional abbreviation of "strategy" (CollapseStrategy)
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    perfsprint:
      # fmt.Sprintf("%s: %s", a, b) reads better than a + ": " + b.
      strconcat: false
    revive:
      # revive's defaults minus exported and package-comments (doc comments
      # are written where they help, not to satisfy a rule), plus the rules
      # after the blank line.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

        - name: atomic
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: early-return
        - name: identical-branches
        - name: import-shadowing
        - name: modifies-value-receiver
        - name: string-of-int
        - name: struct-tag
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: use-any
        - name: useless-break
        - name: waitgroup-by-value
        # Not redundant-import-alias: it flags the fhttp alias in
        # internal/fetcher/transport.go, which is required because
        # github.com/bogdanfinn/fhttp's package name is http.

  exclusions:
    rules:
      # Tests close what they open through t.Cleanup or not at all, talk to
      # httptest servers without contexts, and use fixed temp paths and
      # re-executed fake tools on purpose.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
          - gosec
      # The CLI writes to its own stdout/stderr, where a failed write has no
      # one left to report to.
      - path: internal/cli/
        linters:
          - errcheck
        text: fmt\.Fprint

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
