# golangci-lint v2 config — see https://golangci-lint.run/usage/configuration/
#
# Lint philosophy for curio: catch real bugs (staticcheck, unused, ineffassign,
# rowserrcheck, errorlint) but don't get in the way of standard Go idioms
# (defer Close errors, sentinel error wrapping with %w/%v). gocritic and
# gosec are turned off — they're high-noise relative to signal for a tool
# of this scope.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - prealloc
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - nilerr
    - copyloopvar
    - depguard

  settings:
    depguard:
      rules:
        # Consumers depend on the internal/store interfaces. Only the daemon's
        # main wires the SQLite implementation (plus tests and the
        # test-support packages that build real stores).
        store-boundary:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/curio-daemon/**"
            - "!**/internal/store/sqlite/**"
            - "!**/internal/api/apitest/**"
          deny:
            - pkg: github.com/samsar/curio/internal/store/sqlite
              desc: depend on the internal/store interfaces; only cmd/curio-daemon wires the SQLite implementation
        # Test-support packages import testing by design, so they are the
        # only non-test files allowed to. Deny matches by import-path
        # prefix, which also covers testing/fstest and friends.
        no-test-deps-in-prod:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/store/sqlite/sqlitetest/**"
            - "!**/internal/api/apitest/**"
          deny:
            - pkg: testing
              desc: production code must not link the testing package
            - pkg: github.com/stretchr/testify
              desc: testify is for _test.go files only
            - pkg: github.com/samsar/curio/internal/store/sqlite/sqlitetest
              desc: sqlitetest is test support; production code opens databases through internal/store/sqlite
            - pkg: github.com/samsar/curio/internal/api/apitest
              desc: apitest is test support; production code serves the API through internal/api
    errcheck:
      # Don't flag the idiomatic patterns where the error is genuinely
      # uninteresting: deferred Close on rows / bodies / files, and explicit
      # _ = on best-effort writers.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - os.Setenv
    errorlint:
      # Some older call sites wrap a sentinel with %w and format the cause
      # with %v. fmt.Errorf has accepted several %w verbs since Go 1.20, so new
      # code uses `fmt.Errorf("%w: %w", sentinel, err)` to keep both in the
      # chain; this check stays off until the remaining %v sites are migrated.
      errorf: false
    misspell:
      ignore-rules:
        - strat   # intentional abbreviation of "strategy" (CollapseStrategy)

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      - path: cmd/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
