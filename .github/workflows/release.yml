name: Release

on:
  push:
    tags:
      - "v*"

# Read-only unless a job asks for more; only the publishing job does.
permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    # The workflow pull requests run. It inherits this file's read-only
    # token and sees no secrets.
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: ci
    # cgo is required (sqlite-vec + mattn/go-sqlite3). macos-14 is an
    # Apple Silicon runner, which can natively build darwin/arm64. Adding
    # darwin/amd64 or linux/amd64 means a matrix runner + goreleaser
    # split/merge; deferred until there's demand.
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # goreleaser wants tags + full history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The job that holds the write token and the tap PAT builds from
          # a clean module download, never from a cache another run wrote.
          cache: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on samsar/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
