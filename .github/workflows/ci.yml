name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this workflow as its gate, so a tag can only publish a
  # tree that passes the same checks as a pull request.
  workflow_call:

permissions:
  contents: read

# Actions are pinned by commit SHA (tag in the trailing comment); Dependabot
# bumps both. Tool versions come from the Makefile, never from here.
jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod's go line is the exact toolchain; the Makefile exports it
          # as GOTOOLCHAIN, so nothing is downloaded twice.
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: make tidy-check

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

      - name: End-to-end test
        run: make test-e2e

      - name: Vulnerability check
        run: make vulncheck

  test-macos:
    # macos-14 is the release runner and darwin/arm64 the only platform
    # goreleaser ships, so its tests run here before a tag builds on it.
    name: Unit tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Read the pinned golangci-lint version
        id: pins
        run: echo "golangci-lint=$(make -s golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.pins.outputs.golangci-lint }}

      - name: actionlint
        run: make actionlint
