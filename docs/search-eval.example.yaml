# Example graded query file for `make search-eval` (cmd/searcheval).
#
# The developer's search evaluation runs the daemon's search engine on a copy
# of a home's database and scores its ranking, 100 deep, against these
# judgments, per query and per group of queries:
#
#   sqlite3 -readonly ~/.curio/curio.db ".backup /tmp/copy.db"
#   make search-eval DB=/tmp/copy.db QUERIES=my-queries.yaml \
#       [CONFIG=~/.curio/config.yaml] [JSON=/tmp/run.json] \
#       [BASELINE=/tmp/previous-run.json] [VARIANTS=hybrid,bm25,vector] \
#       [TODAY=YYYY-MM-DD] [PLANS=/tmp/planned-run.json]
#
# The planned variants (planned, and the ablations planned-filters,
# planned-rewrites, planned-names) search each query by the plan
# config.yaml's planner model gives it, in place of its filters: TODAY pins
# the day the planner is told is today, which relative dates ("last week")
# are read from, and PLANS replays a previous report's plans, asking no
# model. A query's filters then serve as the oracle the planner's are
# compared with, dimension by dimension.
#
# A real test set names what you read and what you search for: keep it, and
# every report made with it, outside the repository. This file is synthetic.
#
# Each query has:
#   id        optional; names the query in reports, and matches it against a
#             baseline made before the file changed. Unique when set.
#   kind      optional; queries of one kind are scored as a group.
#   tags      optional; each tag is a group of its own, too.
#   note      optional; a comment on the query, never scored.
#   query     the text, as you would type it into search.
#   filters   optional; the search filters the query runs with (the
#             planned variants' oracle instead), under
#             POST /v1/search's names: saved_after, saved_before,
#             published_after, published_before (a date, midnight UTC, or
#             an RFC 3339 date-time with a zone; windows are
#             [after, before)), site and folder (lists), and
#             include_undated (true or false). A filter search would
#             refuse fails the run before any query, named by its id.
#   relevant  the documents judged relevant, by URL: a URL alone is grade 1
#             (relevant), {url: ..., grade: 2} is what the query is after.
#             URLs are normalized as curio stores them, so a URL pasted from
#             a browser matches.
#
# Every key is checked: one the format doesn't define, or one given twice,
# is an error, not ignored. `curio eval` reads the same format; a file of
# URLs alone, like docs/eval.example.yaml, judges every one at grade 1.

queries:
  - id: sourdough-starter
    kind: topic
    tags: [baking]
    note: the feeding schedule is what this is after
    query: keeping a sourdough starter alive
    relevant:
      - {url: "https://example.com/baking/starter-feeding", grade: 2}
      - https://example.com/baking/levain-basics
      - https://example.com/forum/starter-smells-like-acetone

  - id: tcp-slow-start
    kind: keyword
    tags: [networking]
    query: tcp slow start congestion window
    relevant:
      - {url: "https://example.com/notes/tcp-congestion-control", grade: 2}
      - https://example.com/notes/bufferbloat

  - id: trip-planning
    kind: topic
    tags: [travel, baking]
    query: bakeries worth a detour on a trip
    relevant:
      - https://example.com/travel/bakery-map
      - {url: "https://example.com/travel/lisbon-pasteis", grade: 2}

  - id: saved-bread-2024
    kind: temporal
    tags: [baking]
    note: the filters an ideal reading of "in 2024" sets
    query: bread recipes I saved in 2024
    filters:
      saved_after: 2024-01-01
      saved_before: 2025-01-01
      site: [example.com]
    relevant:
      - {url: "https://example.com/baking/rye-loaf", grade: 2}
      - https://example.com/baking/levain-basics
